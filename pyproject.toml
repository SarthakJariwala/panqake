[project]
name = "panqake"
dynamic = ["version"]
description = "An intuitive CLI for effortless git stacking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prompt-toolkit>=3.0.51",
    "questionary>=2.1.0",
    "rich>=14.0.0",
    "typer>=0.16.0",
]

[project.scripts]
panqake = "panqake.cli:main"
pq = "panqake.cli:main"

[tool.uv]
exclude-newer = "1 day"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/panqake"]

[tool.hatch.build.targets.sdist]
include = ["src/panqake", "README.md"]

[dependency-groups]
dev = ["pytest>=8.3.5", "hatch"]
